[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altshortbot"
version = "0.1.0"
description = "Automated altcoin short-selling bot on Hyperliquid perpetuals"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pandas>=2.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
backtest = ["vectorbt>=0.26", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
altshortbot-live  = "scripts.live_trade:main"
altshortbot-paper = "scripts.paper_trade:main"
altshortbot-backtest = "scripts.bootstrap:main"

[tool.setuptools.packages.find]
include = ["oms*", "risk*", "config*", "shared*", "backtest*", "strategy*", "market_data*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
